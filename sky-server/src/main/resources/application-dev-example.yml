# ============================================
# 配置模板（可以上传到 git）
# 把本文件复制一份改名为 application-dev.yml，
# 填上你自己的真实账号密码即可。真实文件已被 .gitignore 忽略，不会上传。
# ============================================
sky:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: localhost
    port: 3306
    database: sky_take_out
    username: root
    password: 你的数据库密码
  alioss:
    endpoint: oss-cn-shenzhen.aliyuncs.com
    access-key-id: 你的阿里云AccessKeyId
    access-key-secret: 你的阿里云AccessKeySecret
    bucket-name: 你的OSS桶名
  redis:
    host: localhost
    port: 6379
    password: 你的Redis密码
    database: 0
  wechat:
    appid: 你的微信小程序appid
    secret: 你的微信小程序secret
